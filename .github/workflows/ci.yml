name: NYC Taxi Data Engineering CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install System Dependencies & Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Black & Flake8)
        run: |
          black --check src/ tests/ dashboard/
          flake8 src/ tests/ dashboard/ --max-line-length=120

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v
